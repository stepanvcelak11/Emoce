<title>Emoce</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap">
<style>
/* Layout: jednosloupcová mobilní aplikace (max 560px), spodní lišta s 5 záložkami, celoobrazovkové listy pro zápis.
   Barvy: čtyři kvadranty mapy nálady nesou celý barevný příběh, neutrály jsou chladně modrošedé. */
:root{
  --bg:#F3F4F7; --surface:#FFFFFF; --surface-2:#E9EBF1; --fg:#1D2130; --muted:#5F6679; --line:#D8DCE5;
  --ink:#252B45; --on-ink:#FFFFFF;
  --q-red:#E0574A; --q-yellow:#E6A532; --q-blue:#4673CC; --q-green:#379A6C;
  --font-display:"Newsreader", Georgia, "Times New Roman", serif;
  --font-body:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13151B; --surface:#1C1F28; --surface-2:#262A36; --fg:#ECEEF4; --muted:#9AA1B4; --line:#323747;
    --ink:#E6E9F2; --on-ink:#151821;
    --q-red:#EE7366; --q-yellow:#F0BC57; --q-blue:#6E93E4; --q-green:#55BB8B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13151B; --surface:#1C1F28; --surface-2:#262A36; --fg:#ECEEF4; --muted:#9AA1B4; --line:#323747;
  --ink:#E6E9F2; --on-ink:#151821;
  --q-red:#EE7366; --q-yellow:#F0BC57; --q-blue:#6E93E4; --q-green:#55BB8B;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);font-weight:500;text-wrap:balance;margin:0;letter-spacing:-.01em}

.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px}
.top h1{font-size:28px}
.sync{font-size:12px;color:var(--muted);text-align:right}
main{display:flex;flex-direction:column;gap:20px}

/* spodní lišta */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{background:none;border:0;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted)}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--fg)}

/* obecné prvky */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.section-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.section-h h2{font-size:21px}
.label{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font-weight:600;font-size:14px}
.btn.primary{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.btn.danger{color:var(--q-red);border-color:color-mix(in srgb,var(--q-red) 45%,var(--line))}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.4;cursor:default}
.btn-row{display:flex;flex-wrap:wrap;gap:8px}
.linkbtn{background:none;border:0;padding:0;font-weight:600;color:var(--fg);text-decoration:underline;text-underline-offset:3px;font-size:14px}
input[type=text],input[type=search],input[type=datetime-local],textarea,select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{resize:vertical}
.empty{padding:22px 18px;text-align:left;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted)}
.empty h3{color:var(--fg);font-size:19px;margin-bottom:6px}
.empty ol{margin:10px 0 0;padding-left:20px;display:grid;gap:4px}

/* Dnes */
.hello{font-family:var(--font-display);font-size:17px;color:var(--muted);font-style:italic}
.cta{position:relative;overflow:hidden;width:100%;border:0;border-radius:20px;padding:22px 20px;text-align:left;color:#fff;
  background:
   radial-gradient(circle at 0% 0%, var(--q-red) 0, transparent 60%),
   radial-gradient(circle at 100% 0%, var(--q-yellow) 0, transparent 60%),
   radial-gradient(circle at 0% 100%, var(--q-blue) 0, transparent 60%),
   radial-gradient(circle at 100% 100%, var(--q-green) 0, transparent 60%), var(--q-blue);
  display:flex;flex-direction:column;gap:4px;min-height:132px;justify-content:flex-end}
.cta strong{font-family:var(--font-display);font-weight:500;font-size:28px;line-height:1.1;text-shadow:0 1px 12px rgba(0,0,0,.25)}
.cta span{font-size:14px;font-weight:600;opacity:.95;text-shadow:0 1px 8px rgba(0,0,0,.25)}
.daystrip{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--surface-2)}
.daystrip i{flex:1;background:var(--q)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.week .d{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.week .dots{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;min-height:20px;align-content:flex-start;max-width:34px}
.prompt{font-family:var(--font-display);font-size:20px;line-height:1.35;margin:6px 0 12px}

/* záznamy */
.list{display:flex;flex-direction:column;gap:8px}
.entry{display:flex;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.entry-mark{flex:none;width:12px;height:12px;border-radius:50%;background:var(--q);margin-top:6px;box-shadow:0 0 0 4px color-mix(in srgb,var(--q) 20%,transparent)}
.entry-body{min-width:0;display:flex;flex-direction:column;gap:2px;flex:1}
.entry-head{display:flex;justify-content:space-between;gap:10px}
.entry-head strong{font-weight:700}
.entry-head time{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;flex:none}
.tagline{font-size:13px;color:var(--muted)}
.note-ex{font-family:var(--font-display);font-style:italic;font-size:16px;line-height:1.4;white-space:pre-line;overflow-wrap:anywhere}
.dayhead{font-size:13px;font-weight:700;color:var(--muted);margin:6px 0 0;text-transform:capitalize}
.qdot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--q);flex:none}

/* kalendář */
.cal-head{display:flex;align-items:center;justify-content:space-between}
.cal-head h2{font-size:21px;text-transform:capitalize}
.iconbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;font-size:18px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.cal .wd{font-size:11px;font-weight:700;color:var(--muted);text-align:center;padding-bottom:4px}
.cal button{aspect-ratio:1;border:1px solid transparent;background:var(--surface);border-radius:10px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;font-size:13px;font-variant-numeric:tabular-nums;min-width:0}
.cal button.out{visibility:hidden}
.cal button.today{border-color:var(--ink)}
.cal button.sel{background:var(--ink);color:var(--on-ink)}
.cal .cd{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;max-width:100%}
.cal .cd i{width:6px;height:6px;border-radius:50%;background:var(--q)}

/* Psaní */
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.page{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 16px;position:relative}
.page::before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:3px;border-radius:0 3px 3px 0;background:var(--q,var(--line))}
.page h3{font-size:20px;margin-bottom:4px}
.page .meta{font-size:12.5px;color:var(--muted);margin-bottom:8px}
.page .poem{font-family:var(--font-display);font-size:17.5px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;max-height:16.5em;overflow:hidden}

/* Přehled */
.bar{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--surface-2)}
.bar i{background:var(--q);height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.rows{display:grid;gap:10px}
.row{display:grid;grid-template-columns:86px 1fr 34px;align-items:center;gap:10px;font-size:13.5px}
.row .n{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.hbar{height:10px;border-radius:99px;background:var(--q,var(--ink));min-width:4px}
.insight{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.insight:first-child{border-top:0;padding-top:0}
.heat{display:grid;gap:3px;grid-auto-flow:column;grid-template-rows:repeat(1,auto);overflow-x:auto}
.heat .col{display:flex;flex-direction:column-reverse;gap:2px;height:64px;width:100%;min-width:6px}
.heat .col i{flex:1;border-radius:2px;background:var(--q)}
.heat .col.none{background:var(--surface-2);border-radius:2px}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.stat b{display:block;font-family:var(--font-display);font-weight:500;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}

/* Více */
.menu{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.menu button{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border:0;border-top:1px solid var(--line);background:none;text-align:left}
.menu button:first-child{border-top:0}
.menu b{font-weight:600}
.menu small{display:block;color:var(--muted);font-size:13px}
.emo-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.emo-card summary{display:flex;align-items:center;gap:10px;cursor:pointer;list-style:none;font-weight:700}
.emo-card summary::-webkit-details-marker{display:none}
.emo-card p{margin:8px 0}
.form-grid{display:grid;gap:10px}

/* list (sheet) */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;overscroll-behavior:contain}
.sheet-in{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(env(safe-area-inset-top,0px) + 10px) calc(env(safe-area-inset-bottom,0px) + 28px);display:flex;flex-direction:column;gap:16px;min-height:100%}
.sheet-top{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:44px}
.steps{display:flex;gap:6px}
.steps i{width:22px;height:4px;border-radius:9px;background:var(--line)}
.steps i.on{background:var(--ink)}
.flow-h{font-size:27px;line-height:1.15}
.flow-sub{margin:-8px 0 0;color:var(--muted);font-size:14px}
.map{position:relative;width:100%;aspect-ratio:1/0.82;max-height:48vh;border-radius:18px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;cursor:crosshair;margin:0 auto}
.map canvas{position:absolute;inset:0;width:100%;height:100%}
.map::before,.map::after{content:"";position:absolute;background:rgba(255,255,255,.45);pointer-events:none}
.map::before{left:50%;top:0;bottom:0;width:1px}
.map::after{top:50%;left:0;right:0;height:1px}
.ax{position:absolute;font-size:11.5px;font-weight:700;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.35);pointer-events:none;letter-spacing:.03em}
.ax.t{top:8px;left:50%;transform:translateX(-50%)}
.ax.b{bottom:8px;left:50%;transform:translateX(-50%)}
.ax.l{left:10px;top:50%;transform:translateY(-50%)}
.ax.r{right:10px;top:50%;transform:translateY(-50%)}
.qname{position:absolute;font-family:var(--font-display);font-size:18px;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.3);pointer-events:none;opacity:.9}
.marker{position:absolute;width:30px;height:30px;border-radius:50%;border:3px solid #fff;background:rgba(255,255,255,.25);box-shadow:0 2px 10px rgba(0,0,0,.3);transform:translate(-50%,-50%);pointer-events:none}
.qlabel{display:flex;align-items:center;gap:10px}
.qlabel b{font-family:var(--font-display);font-weight:500;font-size:21px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-weight:600;font-size:14px}
.chip.sel{border-color:var(--q,var(--ink));background:color-mix(in srgb,var(--q,var(--ink)) 22%,var(--surface))}
.chip.add{border-style:dashed;color:var(--muted)}
.info{background:color-mix(in srgb,var(--q) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--q) 35%,var(--line));border-radius:12px;padding:12px 14px}
.info b{font-family:var(--font-display);font-weight:500;font-size:19px}
.info p{margin:4px 0 0}
.info .mine{margin-top:8px;font-style:italic;font-family:var(--font-display);font-size:16px}
.tagcat{display:grid;gap:8px}
.writebox{font-family:var(--font-display);font-size:19px;line-height:1.6;min-height:42vh;border-radius:14px;padding:16px;background:var(--surface)}
.writer-title{font-family:var(--font-display);font-size:24px;border:0;background:transparent;padding:4px 0}
.writer-title:focus-visible{outline:none;border-bottom:1px solid var(--line)}
.prompt-line{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;font-family:var(--font-display);font-style:italic;font-size:16.5px;color:var(--muted)}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mic[aria-pressed="true"]{background:var(--q-red);border-color:var(--q-red);color:#fff}
.partial{font-size:13px;color:var(--muted);font-style:italic;min-height:1.2em}
.sticky-actions{position:sticky;bottom:0;margin-top:auto;padding-top:10px;padding-bottom:4px;background:linear-gradient(to bottom,transparent,var(--bg) 30%);display:flex;justify-content:flex-end;gap:8px}
.help{display:flex;flex-direction:column;gap:4px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.help b{font-weight:700}
.help .score{font-size:12.5px;color:var(--q-green);font-weight:600}
.breath{display:grid;place-items:center;padding:24px 0}
.breath .orb{width:180px;height:180px;border-radius:50%;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--q) 55%,#fff),var(--q));transform:scale(.55);transition-property:transform;transition-timing-function:ease-in-out;display:grid;place-items:center}
.breath .orb span{transform:scale(1.6);font-family:var(--font-display);font-size:17px;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.25)}
.breath .phase{margin-top:18px;font-family:var(--font-display);font-size:26px}
.stepnum{font-size:13px;color:var(--muted);font-weight:700}
.bigstep{font-family:var(--font-display);font-size:24px;line-height:1.3}
.detail-emos{font-family:var(--font-display);font-size:30px;line-height:1.15}
.confirm{background:color-mix(in srgb,var(--q-red) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--q-red) 40%,var(--line));border-radius:12px;padding:12px 14px;display:grid;gap:10px}

/* zámek */
.lock{position:fixed;inset:0;z-index:60;background:var(--bg);display:grid;place-items:center;padding:24px}
.lock-in{display:flex;flex-direction:column;align-items:center;gap:18px;width:100%;max-width:300px}
.pins{display:flex;gap:14px}
.pins i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink)}
.pins i.on{background:var(--ink)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%}
.keypad button{aspect-ratio:1.4;border-radius:16px;border:1px solid var(--line);background:var(--surface);font-size:22px;font-weight:600}
.keypad button.blank{visibility:hidden}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--on-ink);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;max-width:calc(100vw - 32px);text-align:center}
@media (prefers-reduced-motion: reduce){
  .breath .orb{transition:none!important}
  .shake{animation:none}
}
</style>

<div class="app">
  <header class="top"><h1 id="viewTitle">Dnes</h1><span class="sync" id="sync"></span></header>
  <main id="view"></main>
</div>

  <button class="tab" data-a="tab" data-tab="denik"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Deník</button>

  <button class="tab" data-a="tab" data-tab="prehled"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Přehled</button>

</div></nav>

<script>
"use strict";
/* ───────────── pomocné ───────────── */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const newId=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clone=o=>JSON.parse(JSON.stringify(o));
const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
          set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},
          del(k){try{localStorage.removeItem(k)}catch(e){}}};
const pad=n=>String(n).padStart(2,"0");
const dayKey=ts=>{const d=new Date(ts);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
const fmtTime=ts=>new Date(ts).toLocaleTimeString("cs-CZ",{hour:"2-digit",minute:"2-digit"});
function dayLabel(key){
  const t=dayKey(Date.now()), y=dayKey(Date.now()-864e5);
  if(key===t) return "Dnes"; if(key===y) return "Včera";
  const [a,b,c]=key.split("-").map(Number);
  return new Date(a,b-1,c).toLocaleDateString("cs-CZ",{weekday:"long",day:"numeric",month:"long"});
}

/* ───────────── úložiště ───────────── */
const DEF_SETTINGS={customEmotions:[],customHelps:[],emotionNotes:{},customTags:[]};
const S={mode:"loading",entries:{},writings:{},settings:clone(DEF_SETTINGS),db:null,uid:null,note:"",dict:null};
function applyData(d){
  if(!d) return;
  S.entries=d.entries||{}; S.writings=d.writings||{};
  S.settings=Object.assign(clone(DEF_SETTINGS),d.settings||{});
}
function persist(){
  const data={entries:S.entries,writings:S.writings,settings:S.settings};
  LS.set(S.mode==="local"?"emoce.local":"emoce.cache",data);
}
const chains={};
function serial(key,fn){const p=(chains[key]||Promise.resolve()).catch(()=>{}).then(fn);chains[key]=p;return p}
function dbErr(e){
  const c=e&&e.code;
  if(c==="quota_exceeded") toast("Úložiště je plné. Smaž prosím pár starých záznamů.");
  else if(c==="revoked"||c==="not_granted") toast("Přístup k úložišti teď není k dispozici.");
  else toast("Uložení se nepovedlo, zkus to prosím znovu.");
}
async function dbWrite(key,fn){
  if(!S.mode.startsWith("cloud")) return;
  try{ await serial(key,fn) }
  catch(e){
    if(e&&e.code==="unavailable"){ await new Promise(r=>setTimeout(r,400+Math.random()*600)); try{await serial(key,fn);return}catch(e2){dbErr(e2);return} }
    dbErr(e);
  }
}
async function putEntry(e){
  e=clone(e); e.upd=Date.now(); S.entries[e.id]=e; persist(); render();
  await dbWrite("e/"+e.id,()=>S.entriesCol.doc(e.id).set(e));
}
async function delEntry(id){
  delete S.entries[id]; persist(); render();
  await dbWrite("e/"+id,()=>S.entriesCol.doc(id).delete());
}
async function putWriting(w){
  w=clone(w); w.upd=Date.now(); S.writings[w.id]=w; persist(); render();
  await dbWrite("w/"+w.id,()=>S.writingsCol.doc(w.id).set(w));
}
async function delWriting(id){
  delete S.writings[id]; persist(); render();
  await dbWrite("w/"+id,()=>S.writingsCol.doc(id).delete());
}
async function saveSettings(){
  persist(); render();
  const body=clone(S.settings);
  await dbWrite("settings",()=>S.settingsRef.set(body));
}

async function initStore(){
  applyData(LS.get("emoce.cache",null)||LS.get("emoce.local",null));
  render();
  let db=null,user=null,dict=null;
  if(window.claude&&typeof window.claude.use==="function"){
    try{[db,user,dict]=await Promise.all([claude.use("db"),claude.use("user"),claude.use("dictation")])}catch(e){}
  }
  S.dict=dict||null; setupDictation();
  let id=null;
  if(db&&user){try{id=await user.id()}catch(e){}}
  if(!db||!id){
    S.mode="local"; applyData(LS.get("emoce.local",null)||LS.get("emoce.cache",null));
    S.note="Ukládá se jen v tomto prohlížeči"; persist(); render(); return;
  }
  S.db=db; S.uid=id; S.mode="cloud-loading"; S.note="Načítám…"; render();
  const base="data/users/"+id;
  S.settingsRef=db.doc(base+"/settings");
  const jr=db.doc(base+"/journal");
  S.entriesCol=jr.collection("entries"); S.writingsCol=jr.collection("writings");
  const got={e:false,w:false,s:false};
  const timer=setTimeout(()=>{if(S.mode==="cloud-loading"){S.note="Data zatím nejdou načíst, zkusím to dál";render()}},10000);
  const done=()=>{if(got.e&&got.w&&got.s&&S.mode==="cloud-loading"){clearTimeout(timer);S.mode="cloud";S.note="";persist();render();migrateLocal()}};
  const fail=e=>{clearTimeout(timer);S.note="Synchronizace se přerušila, zobrazuji uloženou kopii";render()};
  S.entriesCol.onSnapshot(snap=>{const m={};snap.docs.forEach(d=>{m[d.id]=d.data()});S.entries=m;if(!snap.metadata.fromCache)got.e=true;persist();render();done()},fail);
  S.writingsCol.onSnapshot(snap=>{const m={};snap.docs.forEach(d=>{m[d.id]=d.data()});S.writings=m;if(!snap.metadata.fromCache)got.w=true;persist();render();done()},fail);
  S.settingsRef.onSnapshot(snap=>{S.settings=Object.assign(clone(DEF_SETTINGS),snap.exists?clone(snap.data()):{});if(!snap.metadata.fromCache)got.s=true;persist();render();done()},fail);
}
/* záznamy pořízené dřív bez účtu nahraj do soukromého úložiště */
async function migrateLocal(){
  const loc=LS.get("emoce.local",null);
  if(!loc) return;
  const es=Object.values(loc.entries||{}), ws=Object.values(loc.writings||{});
  for(const e of es) if(!S.entries[e.id]) await putEntry(e);
  for(const w of ws) if(!S.writings[w.id]) await putWriting(w);
  LS.del("emoce.local");
}

/* ───────────── odvozená data ───────────── */
const allEmotions=()=>EMOTIONS.concat((S.settings.customEmotions||[]).map(c=>Object.assign({e:3,p:3,custom:true},c)));
const emo=id=>allEmotions().find(e=>e.id===id);
const allTags=()=>{const c=S.settings.customTags||[];return c.length?TAGCATS.concat([["Vlastní",c]]):TAGCATS};
const allHelps=()=>(S.settings.customHelps||[]).map(h=>Object.assign({kind:"custom",custom:true},h)).concat(HELPS);
const helpById=id=>allHelps().find(h=>h.id===id);
const entriesSorted=()=>Object.values(S.entries).sort((a,b)=>b.ts-a.ts);
const emoNames=e=>(e.emos||[]).map(id=>emo(id)?.n).filter(Boolean);
function helpScores(){
  const m={};
  for(const e of Object.values(S.entries)){ if(!e.helped||!e.helped.id) continue;
    const s=m[e.helped.id]||(m[e.helped.id]={n:0,sum:0}); s.n++; s.sum+=({ano:2,trochu:1,ne:0}[e.helped.r]??0); }
  return m;
}

/* ───────────── Dnes ───────────── */
function greeting(){const h=new Date().getHours();return h<5?"Dobrou noc":h<10?"Dobré ráno":h<18?"Dobrý den":"Dobrý večer"}
function todayPrompt(){const d=Math.floor((Date.now()-new Date().getTimezoneOffset()*6e4)/864e5);return PROMPTS[d%PROMPTS.length]}
function viewToday(){
  const all=entriesSorted(); const tk=dayKey(Date.now());
  const today=all.filter(e=>dayKey(e.ts)===tk);
  let h=`<div class="hello">${greeting()}. Jak ti je?</div>
  <button class="cta" data-a="new"><strong>Jak se teď cítíš?</strong><span>Zapsat emoci</span></button>`;
  if(!all.length){
    h+=`<div class="empty"><h3>Tvůj deník emocí je zatím prázdný</h3>
      Zápis zabere asi minutu:
      <ol><li>Na barevné mapě ukážeš, kolik máš energie a jak příjemně se cítíš.</li>
      <li>Vybereš emoci, která sedí nejlíp. U každé je vysvětlení, co znamená.</li>
      <li>Přidáš, kde jsi a co děláš, a klidně i pár vlastních slov nebo verš.</li>
      <li>Aplikace ti nabídne něco, co může pomoct, a časem ukáže, co tvou náladu ovlivňuje.</li></ol></div>`;
  }else{
    const counts={};today.forEach(e=>counts[e.q]=(counts[e.q]||0)+1);
    const dom=Object.entries(counts).sort((a,b)=>b[1]-a[1])[0];
    h+=`<section class="card" style="display:grid;gap:12px">
      <div class="section-h"><h2>Tvůj den</h2><span class="muted small">${today.length?today.length+" "+plural(today.length,"záznam","záznamy","záznamů"):"zatím bez záznamu"}</span></div>
      ${today.length?`<div class="daystrip">${today.slice().reverse().map(e=>`<i style="${qv(e.q)}"></i>`).join("")}</div>
      <div class="small muted">Převažuje <b style="color:var(--fg)">${Q[dom[0]].name.toLowerCase()}</b> (${Q[dom[0]].sub}).</div>`:`<div class="small muted">Dnešní nálady se tu poskládají do barevného pruhu.</div>`}
      ${weekStrip()}
    </section>`;
    if(today.length) h+=`<section class="list"><div class="label">Dnešní záznamy</div>${today.map(entryCard).join("")}</section>`;
  }
  h+=`<section class="card"><div class="label">Podnět k psaní</div><p class="prompt">${esc(todayPrompt())}</p>
    <button class="btn" data-a="write-new" data-prompt="1">Napsat</button></section>`;

function weekStrip(){
  const days=[];for(let i=6;i>=0;i--){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-i);days.push(d)}
  const by={};Object.values(S.entries).forEach(e=>{(by[dayKey(e.ts)]||(by[dayKey(e.ts)]=[])).push(e)});
  return `<div class="week">${days.map(d=>{const k=dayKey(d);const es=(by[k]||[]).sort((a,b)=>a.ts-b.ts).slice(0,8);
    return `<div class="d"><span>${d.toLocaleDateString("cs-CZ",{weekday:"short"})}</span><span class="dots">${es.map(e=>`<span class="qdot" style="${qv(e.q)};width:8px;height:8px"></span>`).join("")}</span></div>`}).join("")}</div>`;
}
function plural(n,a,b,c){return n===1?a:(n>=2&&n<=4)?b:c}
function entryCard(e){
  const em=emoNames(e);
  return `<button class="entry" data-a="open-entry" data-id="${esc(e.id)}" style="${qv(e.q)}">
    <span class="entry-mark"></span>

      ${e.note?`<span class="note-ex">${esc(e.note.length>180?e.note.slice(0,180)+"…":e.note)}</span>`:""}

}

/* ───────────── Deník ───────────── */
function viewJournal(){
  const m=ui.month, y=m.getFullYear(), mo=m.getMonth();
  const first=new Date(y,mo,1), days=new Date(y,mo+1,0).getDate();
  const lead=(first.getDay()+6)%7;
  const by={};Object.values(S.entries).forEach(e=>{(by[dayKey(e.ts)]||(by[dayKey(e.ts)]=[])).push(e)});
  const tk=dayKey(Date.now());
  let cells="";
  ["Po","Út","St","Čt","Pá","So","Ne"].forEach(w=>cells+=`<div class="wd">${w}</div>`);
  for(let i=0;i<lead;i++) cells+=`<button class="out" tabindex="-1" aria-hidden="true"></button>`;
  for(let d=1;d<=days;d++){
    const k=y+"-"+pad(mo+1)+"-"+pad(d); const es=(by[k]||[]).sort((a,b)=>a.ts-b.ts);
    cells+=`<button data-a="cal-day" data-d="${k}" class="${k===tk?"today":""} ${ui.selDay===k?"sel":""}" aria-label="${d}. ${es.length} záznamů"><span>${d}</span><span class="cd">${es.slice(0,6).map(e=>`<i style="${qv(e.q)}"></i>`).join("")}</span></button>`;
  }

  if(ui.selDay){
    const es=(by[ui.selDay]||[]).sort((a,b)=>b.ts-a.ts);
    list=`<div class="section-h"><div class="dayhead">${esc(dayLabel(ui.selDay))}</div><button class="linkbtn" data-a="cal-day" data-d="${ui.selDay}">Celý měsíc</button></div>`+
      (es.length?es.map(entryCard).join(""):`<div class="empty">Tento den nemáš žádný záznam.</div>`);
  }else{
    const es=entriesSorted().filter(e=>{const d=new Date(e.ts);return d.getFullYear()===y&&d.getMonth()===mo});
    if(!es.length) list=`<div class="empty">V tomto měsíci zatím nic není. Záznamy se tu ukážou po dnech, nejnovější nahoře.</div>`;
    else{ let last=""; list=es.map(e=>{const k=dayKey(e.ts);const hd=k!==last?`<div class="dayhead">${esc(dayLabel(k))}</div>`:"";last=k;return hd+entryCard(e)}).join("") }
  }
  return `<section class="card">
    <div class="cal-head"><button class="iconbtn" data-a="cal-prev" aria-label="Předchozí měsíc">‹</button>
    <h2>${first.toLocaleDateString("cs-CZ",{month:"long",year:"numeric"})}</h2>
    <button class="iconbtn" data-a="cal-next" aria-label="Další měsíc">›</button></div>
    <div class="cal">${cells}</div></section>
    <section class="list">${list}</section>`;
}

  }else{

      if(i.kind==="w"){const w=i.o;return `<button class="page" data-a="open-writing" data-id="${esc(w.id)}" ${w.q?`style="${qv(w.q)}"`:""}>

/* ───────────── Přehled ───────────── */
function viewInsights(){
  const cut=ui.range==="all"?0:Date.now()-ui.range*864e5;
  const es=entriesSorted().filter(e=>e.ts>=cut);
  let h=`<div class="seg" role="group" aria-label="Období">${[[7,"7 dní"],[30,"30 dní"],[90,"3 měsíce"],["all","Vše"]].map(([r,l])=>`<button data-a="range" data-r="${r}" aria-pressed="${String(ui.range)===String(r)}">${l}</button>`).join("")}</div>`;
  if(es.length<3){
    return h+`<div class="empty"><h3>Přehled se skládá postupně</h3>Po prvních několika záznamech tu uvidíš, které emoce převažují, v jakou denní dobu se jak cítíš a co tvou náladu ovlivňuje. Teď ${es.length?"máš v tomto období "+es.length+" "+plural(es.length,"záznam","záznamy","záznamů"):"tu zatím nic není"}, potřeba jsou aspoň 3.</div>`;
  }
  const n=es.length, qc={red:0,yellow:0,blue:0,green:0};es.forEach(e=>qc[e.q]++);
  const pleasant=(qc.yellow+qc.green)/n;
  const days=new Set(es.map(e=>dayKey(e.ts))).size;
  h+=`<div class="stat-grid">
    <div class="stat"><b>${n}</b><span>${plural(n,"záznam","záznamy","záznamů")}</span></div>
    <div class="stat"><b>${days}</b><span>${plural(days,"den","dny","dní")} se zápisem</span></div>
    <div class="stat"><b>${Math.round(pleasant*100)} %</b><span>příjemných</span></div></div>`;
  h+=`<section class="card"><div class="label" style="margin-bottom:10px">Rozložení nálad</div>
    <div class="bar">${QS.filter(q=>qc[q]).map(q=>`<i style="${qv(q)};width:${qc[q]/n*100}%" title="${Q[q].name}"></i>`).join("")}</div>
    <div class="legend">${QS.map(q=>`<span><span class="qdot" style="${qv(q)}"></span>${Q[q].name} ${Math.round(qc[q]/n*100)} %</span>`).join("")}</div></section>`;
  // pruh posledních dní
  const span=ui.range==="all"?30:Math.min(ui.range,30);
  const by={};es.forEach(e=>{(by[dayKey(e.ts)]||(by[dayKey(e.ts)]=[])).push(e)});
  let cols="";for(let i=span-1;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=dayKey(d);const de=(by[k]||[]).sort((a,b)=>a.ts-b.ts);
    cols+=de.length?`<span class="col" title="${esc(dayLabel(k))}">${de.map(e=>`<i style="${qv(e.q)}"></i>`).join("")}</span>`:`<span class="col none" title="${esc(dayLabel(k))}"></span>`}
  h+=`<section class="card"><div class="label" style="margin-bottom:10px">Posledních ${span} ${plural(span,"den","dny","dní")}</div>
    <div class="heat" style="grid-template-columns:repeat(${span},1fr)">${cols}</div>
    <div class="small muted" style="display:flex;justify-content:space-between;margin-top:6px"><span>${span===7?"před týdnem":"před "+span+" dny"}</span><span>dnes</span></div></section>`;
  // nejčastější emoce
  const ec={};es.forEach(e=>(e.emos||[]).forEach(id=>ec[id]=(ec[id]||0)+1));
  const top=Object.entries(ec).sort((a,b)=>b[1]-a[1]).slice(0,6);
  if(top.length){const mx=top[0][1];
    h+=`<section class="card"><div class="label" style="margin-bottom:12px">Nejčastější emoce</div><div class="rows">${top.map(([id,c])=>{const m=emo(id);if(!m)return"";
      return `<div class="row" style="${qv(m.q)}"><span>${esc(m.n)}</span><span class="hbar" style="width:${c/mx*100}%"></span><span class="n">${c}×</span></div>`}).join("")}</div></section>`;}
  // denní doba
  const buckets=[["Ráno",5,11],["Odpoledne",11,17],["Večer",17,22],["Noc",22,29]];
  const bq=buckets.map(([l,a,b])=>{const c={red:0,yellow:0,blue:0,green:0};let t=0;es.forEach(e=>{let hr=new Date(e.ts).getHours();if(hr<5)hr+=24;if(hr>=a&&hr<b){c[e.q]++;t++}});return {l,c,t}});
  h+=`<section class="card"><div class="label" style="margin-bottom:12px">Během dne</div><div class="rows">${bq.map(b=>`<div class="row"><span>${b.l}</span>
    <span class="bar" style="height:10px">${b.t?QS.filter(q=>b.c[q]).map(q=>`<i style="${qv(q)};width:${b.c[q]/b.t*100}%"></i>`).join(""):""}</span><span class="n">${b.t}</span></div>`).join("")}</div></section>`;
  // postřehy
  const ins=insights(es,pleasant);
  h+=`<section class="card"><div class="label" style="margin-bottom:12px">Co jsem si všiml(a)</div>${ins.length?ins.map(t=>`<div class="insight"><span class="qdot" style="${qv(t.q)};margin-top:6px"></span><div>${t.html}</div></div>`).join(""):`<div class="muted small">Zatím málo dat na postřehy. Přidávej k záznamům štítky (kde jsi, s kým, spánek…) a postřehy se objeví.</div>`}</section>`;
  // co pomáhá
  const hs=helpScores(); const hl=Object.entries(hs).map(([id,s])=>({h:helpById(id),...s})).filter(x=>x.h).sort((a,b)=>b.sum/b.n-a.sum/a.n);
  h+=`<section class="card"><div class="label" style="margin-bottom:12px">Co ti pomáhá</div>${hl.length?`<div class="rows">${hl.map(x=>`<div class="row" style="grid-template-columns:1fr auto"><span><b>${esc(x.h.n)}</b><br><span class="small muted">vyzkoušeno ${x.n}×</span></span><span class="small" style="font-weight:700;color:${x.sum/x.n>=1.5?"var(--q-green)":x.sum/x.n>=.8?"var(--fg)":"var(--muted)"}">${x.sum/x.n>=1.5?"pomáhá":x.sum/x.n>=.8?"trochu":"spíš ne"}</span></div>`).join("")}</div>`:`<div class="muted small">Po zápisu si můžeš vyzkoušet cvičení a ohodnotit, jestli pomohlo. Tady pak uvidíš, co u tebe funguje.</div>`}</section>`;
  return h;
}
function insights(es,base){
  const out=[]; const n=es.length;
  const tc={};es.forEach(e=>(e.tags||[]).forEach(t=>{const o=tc[t]||(tc[t]={n:0,p:0,hi:0});o.n++;if(e.q==="yellow"||e.q==="green")o.p++;if(e.q==="red"||e.q==="yellow")o.hi++}));
  const tagI=[];
  for(const [t,o] of Object.entries(tc)){ if(o.n<3||o.n===n) continue;
    const s=o.p/o.n, d=s-base; if(Math.abs(d)>=.2) tagI.push({d,html:`Když je u záznamu <b>${esc(t)}</b>, cítíš se příjemně ${d<0?"jen ":""}v ${Math.round(s*100)} % případů. Jinak je to průměrně ${Math.round(base*100)} %.`,q:d>0?"green":"blue"}) }
  tagI.sort((a,b)=>Math.abs(b.d)-Math.abs(a.d)); out.push(...tagI.slice(0,4));
  // den v týdnu
  const wd=[0,0,0,0,0,0,0],wp=[0,0,0,0,0,0,0];es.forEach(e=>{const d=(new Date(e.ts).getDay()+6)%7;wd[d]++;if(e.q==="yellow"||e.q==="green")wp[d]++});
  const names=["v pondělí","v úterý","ve středu","ve čtvrtek","v pátek","v sobotu","v neděli"];
  let best=-1,bs=-1,worst=-1,ws=2;wd.forEach((c,i)=>{if(c>=2){const s=wp[i]/c;if(s>bs){bs=s;best=i}if(s<ws){ws=s;worst=i}}});
  if(best>=0&&worst>=0&&best!==worst&&bs-ws>=.25){out.push({q:"yellow",html:`Nejlépe ti bývá <b>${names[best]}</b> (${Math.round(bs*100)} % příjemných záznamů), nejhůř <b>${names[worst]}</b> (${Math.round(ws*100)} %).`})}
  // energie
  const hi=es.filter(e=>e.q==="red"||e.q==="yellow").length/n;
  if(hi>=.7) out.push({q:"red",html:`Většina záznamů (${Math.round(hi*100)} %) je s vysokou energií. Najdi si během dne i chvíle na zpomalení.`});
  else if(hi<=.3) out.push({q:"green",html:`Většina záznamů (${Math.round((1-hi)*100)} %) je s nízkou energií. Všímej si, co tě nabíjí: spánek, pohyb, lidé?`});
  return out;
}

/* — mapa nálady — */
function hexToRgb(h){h=h.replace("#","");if(h.length===3)h=h.split("").map(c=>c+c).join("");const n=parseInt(h,16);return [n>>16&255,n>>8&255,n&255]}
function sm(t){return t<.5?.5*Math.pow(2*t,2.2):1-.5*Math.pow(2-2*t,2.2)}
function drawMap(){
  const c=$("#mapc");if(!c)return;
  const cs=getComputedStyle(document.documentElement);
  const g=k=>hexToRgb(cs.getPropertyValue(k).trim()||"#888888");
  const tl=g("--q-red"),tr=g("--q-yellow"),bl=g("--q-blue"),br=g("--q-green");
  const N=48,ctx=c.getContext("2d"),img=ctx.createImageData(N,N);
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const u=sm(x/(N-1)),v=sm(y/(N-1)),i=(y*N+x)*4;
    for(let k=0;k<3;k++){const top=tl[k]+(tr[k]-tl[k])*u,bot=bl[k]+(br[k]-bl[k])*u;img.data[i+k]=top+(bot-top)*v}
    img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
}
const quadOf=(x,y)=>y<.5?(x<.5?"red":"yellow"):(x<.5?"blue":"green");
function emoPos(m){const q=Q[m.q];return {x:Math.min(.97,Math.max(.03,.5+(q.pl?1:-1)*m.p/10.5)),y:Math.min(.97,Math.max(.03,.5+(q.hi?-1:1)*m.e/10.5))}}
function sortedEmos(){
  const f=ui.sheet;
  if(f.search.trim()){const s=norm(f.search);return allEmotions().filter(e=>norm(e.n).includes(s))}
  if(f.q==null) return [];
  const ei=Math.abs(f.y-.5)*10,pi=Math.abs(f.x-.5)*10;
  return allEmotions().filter(e=>e.q===f.q).sort((a,b)=>((a.e-ei)**2+(a.p-pi)**2)-((b.e-ei)**2+(b.p-pi)**2));
}
function updateMapUI(){
  const f=ui.sheet;if(!f||f.step!==1)return;
  const mk=$("#marker"),map=$("#map");
  if(f.x!=null){mk.hidden=false;mk.style.left=f.x*100+"%";mk.style.top=f.y*100+"%";map.setAttribute("aria-valuetext",Q[f.q].name+", "+Q[f.q].sub)}
  $("#qlabel").innerHTML=f.q?`<span class="qdot" style="${qv(f.q)};width:14px;height:14px"></span><span><b>${Q[f.q].name}</b> <span class="muted small">${Q[f.q].sub}</span></span>`:"";
  const list=sortedEmos(); const show=f.showAll||f.search.trim()?list:list.slice(0,10);
  let h="";
  if(f.x==null&&!f.search.trim()) h=`<div class="muted small">Až ťukneš do mapy, nabídnou se ti emoce, které k tomu místu sedí.</div>`;
  else{
    h=`<div class="label" style="margin-bottom:8px">${f.search.trim()?"Nalezené emoce":"Která emoce sedí nejlíp?"} <span style="text-transform:none;letter-spacing:0;font-weight:500">(až 3)</span></div><div class="chips">`+
      show.map(e=>`<button class="chip ${f.emos.includes(e.id)?"sel":""}" style="${qv(e.q)}" data-a="emo" data-id="${e.id}" aria-pressed="${f.emos.includes(e.id)}">${esc(e.n)}</button>`).join("")+
      (!f.showAll&&!f.search.trim()&&list.length>show.length?`<button class="chip add" data-a="emo-all">Další (${list.length-show.length})</button>`:"")+
      (f.search.trim()&&!list.length?`<span class="muted small">Nic nenalezeno. Vlastní emoci přidáš ve Více › Slovník.</span>`:"")+`</div>`;
  }
  $("#emoList").innerHTML=h;
  const fm=f.focus&&emo(f.focus);
  const note=fm&&(S.settings.emotionNotes||{})[fm.id];
  $("#emoInfo").innerHTML=fm?`<div class="info" style="${qv(fm.q)}"><b>${esc(fm.n)}</b><p>${esc(fm.d||"")}</p>${note?`<div class="mine">Pro mě: ${esc(note)}</div>`:""}</div>`:"";
  const nb=$("#nextBtn"); if(nb) nb.disabled=f.x==null;
}
function bindMap(){
  const map=$("#map");if(!map)return;let drag=false;
  const set=ev=>{const r=map.getBoundingClientRect();const f=ui.sheet;
    f.x=Math.min(.98,Math.max(.02,(ev.clientX-r.left)/r.width));f.y=Math.min(.98,Math.max(.02,(ev.clientY-r.top)/r.height));
    const nq=quadOf(f.x,f.y);if(nq!==f.q){f.q=nq;f.showAll=false}f.search="";const si=$("#emoSearch");if(si)si.value="";updateMapUI()};
  map.addEventListener("pointerdown",ev=>{drag=true;try{map.setPointerCapture(ev.pointerId)}catch(e){}set(ev)});
  map.addEventListener("pointermove",ev=>{if(drag)set(ev)});
  const end=()=>{drag=false};map.addEventListener("pointerup",end);map.addEventListener("pointercancel",end);
  map.addEventListener("keydown",ev=>{const f=ui.sheet;const d={ArrowLeft:[-.04,0],ArrowRight:[.04,0],ArrowUp:[0,-.04],ArrowDown:[0,.04]}[ev.key];if(!d)return;ev.preventDefault();
    if(f.x==null){f.x=.5;f.y=.5}f.x=Math.min(.98,Math.max(.02,f.x+d[0]));f.y=Math.min(.98,Math.max(.02,f.y+d[1]));f.q=quadOf(f.x,f.y);updateMapUI()});
}

new MutationObserver(drawMap).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});

/* — cvičení — */
let breathT=null;
function stopBreath(){if(breathT){clearTimeout(breathT);breathT=null}}
function runExercise(){
  const f=ui.sheet,h=helpById(f.ex.id);if(h.kind!=="breath")return;
  stopBreath();
  const orb=$("#orb"),ph=$("#bphase"),left=$("#bleft"),cnt=$("#bcount");
  const total=60;let el=0,pi=0;
  const step=()=>{
    if(!$("#orb"))return;
    if(el>=total){ph.textContent="Hotovo";left.textContent="Můžeš pokračovat";orb.style.transitionDuration="2s";orb.style.transform="scale(.55)";cnt.textContent="";return}
    const [name,sec]=h.pattern[pi%h.pattern.length];
    ph.textContent=name;orb.style.transitionDuration=sec+"s";
    if(name==="Nádech")orb.style.transform="scale(1)";else if(name==="Výdech")orb.style.transform="scale(.55)";
    let c=sec;cnt.textContent=c;
    const tick=()=>{c--;el++;left.textContent="zbývá "+Math.max(0,total-el)+" s";if(c>0){cnt.textContent=c;breathT=setTimeout(tick,1000)}else{pi++;step()}};
    breathT=setTimeout(tick,1000);
  };
  breathT=setTimeout(step,800);
}

/* — PIN — */
async function hashPin(pin,salt){
  try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(salt+":"+pin));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
  catch(e){let h=0;for(const c of salt+pin)h=(h*31+c.charCodeAt(0))|0;return "x"+h}
}
function keypad(buf){
  return `<div class="pins">${[0,1,2,3].map(i=>`<i class="${i<buf.length?"on":""}"></i>`).join("")}</div>
  <div class="keypad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-a="key" data-k="${n}">${n}</button>`).join("")}<button class="blank" tabindex="-1" aria-hidden="true"></button><button data-a="key" data-k="0">0</button><button data-a="key" data-k="del" aria-label="Smazat">⌫</button></div>`;
}
function sheetPin(){
  const s=ui.sheet;
  return `<div class="sheet-top"><button class="btn ghost" data-a="sheet-close">Zrušit</button></div>
  <div class="lock-in" style="margin:20px auto" id="pinBox"><h2 class="flow-h">${s.mode==="set1"?"Zvol si čtyřmístný PIN":"Zadej PIN ještě jednou"}</h2>${keypad(s.buf)}</div>`;
}
const lockS={buf:"",hiddenAt:0,forgot:false};
function showLock(){if(!LS.get("emoce.pin",null))return;lockS.buf="";lockS.forgot=false;renderLock();$("#lock").hidden=false}
function renderLock(){
  $("#lock").innerHTML=`<div class="lock-in" id="lockBox"><h2 class="flow-h">Emoce</h2><p class="muted" style="margin:0">Zadej svůj PIN</p>${keypad(lockS.buf)}
   ${lockS.forgot?`<div class="confirm"><span class="small">Zámek můžeš vypnout. Data zůstanou zachovaná, jde jen o ochranu obrazovky.</span><div class="btn-row"><button class="btn danger" data-a="lock-reset">Vypnout zámek</button><button class="btn" data-a="lock-forgot">Zpět</button></div></div>`
   :`<button class="linkbtn" data-a="lock-forgot">Zapomenutý PIN</button>`}</div>`;
}
document.addEventListener("visibilitychange",()=>{if(document.hidden)lockS.hiddenAt=Date.now();else if(lockS.hiddenAt&&Date.now()-lockS.hiddenAt>60000&&$("#lock").hidden)showLock()});
async function pressKey(k){
  const inLock=!$("#lock").hidden;
  const st=inLock?lockS:ui.sheet;
  if(k==="del")st.buf=st.buf.slice(0,-1);else if(st.buf.length<4)st.buf+=k;
  if(inLock)renderLock();else renderSheet();
  if(st.buf.length<4)return;
  if(inLock){
    const p=LS.get("emoce.pin",null);const h=await hashPin(st.buf,p.salt);
    if(h===p.h){$("#lock").hidden=true;$("#lock").innerHTML=""}
    else{st.buf="";renderLock();const b=$("#lockBox");b.classList.add("shake");toast("Nesprávný PIN")}
    return;
  }
  if(st.mode==="set1"){st.first=st.buf;st.buf="";st.mode="set2";renderSheet();return}
  if(st.buf!==st.first){st.buf="";st.first="";st.mode="set1";renderSheet();$("#pinBox").classList.add("shake");toast("PINy se neshodují, zkus to znovu");return}
  const salt=Math.random().toString(36).slice(2);LS.set("emoce.pin",{salt,h:await hashPin(st.buf,salt)});
  closeSheet();toast("Zámek je zapnutý");
}

/* ───────────── diktování ───────────── */
const dictState={on:false,target:null};
function setupDictation(){
  const d=S.dict;if(!d)return;
  d.onFinal(({text})=>{const ta=dictState.target&&document.getElementById(dictState.target);if(!ta)return;
    const t=ta.value?text:text.replace(/^\s+/,"");ta.value+=t;ta.dispatchEvent(new Event("input",{bubbles:true}))});
  d.onPartial(({text})=>{const p=$("#partial");if(p)p.textContent=text});
  d.onState(({state,reason})=>{dictState.on=state!=="idle";const b=document.querySelector(".mic");
    if(b){b.setAttribute("aria-pressed",String(dictState.on));b.textContent=dictState.on?"■ Zastavit diktování":"● Diktovat"}
    if(state==="idle"){const p=$("#partial");if(p)p.textContent="";
      if(reason==="unavailable"){S.dict=null;document.querySelectorAll(".tools").forEach(n=>n.remove());toast("Diktování tady není dostupné")}
      if(reason==="upstream_error")toast("Diktování se přerušilo")}});
}
function stopDictation(){if(S.dict&&dictState.on){S.dict.stop().catch(()=>{})}}
function toggleMic(){
  const d=S.dict;if(!d)return;
  if(dictState.on){d.stop().catch(()=>{});return}
  dictState.target=$("#noteTa")?"noteTa":$("#exTa")?"exTa":"wText";
  d.start({language:"cs"}).catch(e=>{const c=e&&e.code;
    if(c==="not_granted"){S.dict=null;document.querySelectorAll(".tools").forEach(n=>n.remove());toast("Diktování je vypnuté, můžeš psát")}
    else if(c==="unavailable")toast("Diktování v češtině tu není dostupné");
    else if(c==="rate_limited")toast("Zkus diktování za chvilku");});
}

async function offerFile(filename,content,title){
  let dl=null;try{dl=window.claude&&await claude.use("downloads")}catch(e){}
  if(!dl){openSheet({type:"text",title,content});return}
  try{await dl.save({filename,data:content});toast("Soubor je připravený")}
  catch(e){const c=e&&e.code;if(c==="declined")return;if(c==="rate_limited"){toast("Chvilku počkej a zkus to znovu");return}openSheet({type:"text",title,content})}
}

async function importJSON(file){
  let d;try{d=JSON.parse(await file.text())}catch(e){toast("Soubor se nepodařilo přečíst");return}
  if(!d||d.app!=="emoce"){toast("Tohle není záloha z Emocí");return}
  let n=0;
  for(const e of d.entries||[]){if(e&&e.id&&e.ts&&Q[e.q]){await putEntry(e);n++}}
  for(const w of d.writings||[]){if(w&&w.id&&w.ts){await putWriting(w);n++}}
  if(d.settings){S.settings=Object.assign(clone(DEF_SETTINGS),S.settings,d.settings);await saveSettings()}
  toast("Obnoveno: "+n+" položek");
}
async function wipeAll(){
  const ids=Object.keys(S.entries),ws=Object.keys(S.writings);

  "lock-reset":()=>{LS.del("emoce.pin");$("#lock").hidden=true;$("#lock").innerHTML="";toast("Zámek je vypnutý")},
  "exp-csv":()=>exportCSV(),
  "exp-json":()=>exportJSON(),
  "exp-report":()=>exportReport(),
  "imp-json":()=>$("#importFile").click(),
  wipe:()=>{ui.wipe=true;render()},
  "wipe-no":()=>{ui.wipe=false;render()},
  "wipe-yes":()=>wipeAll(),
  "copy-text":()=>{const ta=$("#plainText");const v=ta.value;
    try{navigator.clipboard.writeText(v).then(()=>toast("Zkopírováno"),()=>{ta.select();toast("Text je označený, zkopíruj ho")})}catch(e){ta.select();toast("Text je označený, zkopíruj ho")}},
};
function readFlowInputs(){
  const f=ui.sheet;if(!f)return;
  const ta=$("#noteTa");if(ta)f.note=ta.value;
  const ts=$("#tsIn");if(ts&&ts.value){const d=new Date(ts.value);if(!isNaN(d))f.ts=d.getTime()}
}
function readWriter(){const w=ui.sheet;const t=$("#wTitle"),x=$("#wText");if(t)w.title=t.value;if(x)w.text=x.value}

document.addEventListener("click",ev=>{const t=ev.target.closest("[data-a]");if(!t)return;const fn=A[t.dataset.a];if(fn){ev.preventDefault();fn(t,ev)}});
document.addEventListener("input",ev=>{
  const t=ev.target;
  if(t.id==="emoSearch"&&ui.sheet){ui.sheet.search=t.value;updateMapUI()}
  else if(t.id==="noteTa"&&ui.sheet)ui.sheet.note=t.value;
  else if(t.id==="dictSearch"){ui.dictS=t.value;const pos=t.selectionStart;render();const n=$("#dictSearch");if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}}}
});
let noteTimers={};
document.addEventListener("change",ev=>{
  const t=ev.target;
  if(t.dataset&&t.dataset.note){const id=t.dataset.note,v=t.value.trim();const notes=Object.assign({},S.settings.emotionNotes||{});if(v)notes[id]=v;else delete notes[id];
    S.settings.emotionNotes=notes;persist();const body=clone(S.settings);dbWrite("settings",()=>S.settingsRef.set(body));toast("Poznámka uložena")}
  if(t.id==="importFile"&&t.files&&t.files[0]){importJSON(t.files[0]);t.value=""}
});
window.addEventListener("hashchange",()=>{setTabFromHash();render()});

/* ───────────── start ───────────── */
setTabFromHash();
showLock();
initStore();
</script>
